name: Atualizar dados

# Horário de Brasília (UTC-3): 7h, 12h e 22h
on:
  schedule:
    - cron: "0 10 * * *"   # 07:00 BRT
    - cron: "0 15 * * *"   # 12:00 BRT
    - cron: "0 1 * * *"    # 22:00 BRT (01:00 UTC do dia seguinte)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_all.py
      - name: Commit e push (dispara o deploy do Netlify)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: atualização automática $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi
